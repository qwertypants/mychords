name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      index_hash: ${{ steps.hashes.outputs.index_hash }}
      worker_hash: ${{ steps.hashes.outputs.worker_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run catalog:audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa -- --project=desktop
      - name: Record artifact hashes
        id: hashes
        run: |
          echo "index_hash=$(sha256sum dist/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "worker_hash=$(sha256sum dist/sw.js | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify deployed artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEX_HASH: ${{ needs.build.outputs.index_hash }}
          WORKER_HASH: ${{ needs.build.outputs.worker_hash }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          for attempt in $(seq 1 90); do
            index=$(curl -fsSL "${PAGE_URL%/}/index.html" | sha256sum | cut -d ' ' -f 1) || index=failed
            worker=$(curl -fsSL "${PAGE_URL%/}/sw.js" | sha256sum | cut -d ' ' -f 1) || worker=failed
            if [ "$index" = "$INDEX_HASH" ] && [ "$worker" = "$WORKER_HASH" ]; then
              echo "Verified Pages deployment of $DEPLOYED_COMMIT at $PAGE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Pages did not serve the built index.html and sw.js within 15 minutes" >&2
          exit 1
